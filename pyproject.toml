[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-attribution-lab"
version = "0.1.0"
description = "B2B multi-touch attribution and funnel analytics engine, validated against synthetic journeys with known causal ground truth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hussain Singapuri", email = "Hussainsingapuri24@gmail.com" }]
keywords = ["attribution", "markov", "shapley", "gtm", "analytics-engineering", "duckdb"]
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
gal = "gal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that run the full pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/gal"]

# pandas is typed as Any on purpose: pandas-stubs' overloads are stricter than the
# DataFrame-shuffling code here benefits from. All of gal's own APIs stay fully typed.
[[tool.mypy.overrides]]
module = ["duckdb.*", "pandas.*"]
ignore_missing_imports = true
follow_imports = "skip"
