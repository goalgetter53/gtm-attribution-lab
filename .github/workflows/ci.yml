name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest --cov=gal --cov-report=term-missing
      - name: Smoke-run the pipeline (small synthetic world)
        run: |
          gal generate -c configs/default.yaml -o data/raw --n-accounts 400
          gal build --raw data/raw --db data/warehouse.duckdb
          gal attribute --raw data/raw --db data/warehouse.duckdb -o results/attribution.csv
