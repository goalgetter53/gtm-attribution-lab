# gtm-attribution-lab — default SYNTHETIC world.
# Every number below is a simulation assumption, not a benchmark from real data.
#
# Stage transitions are indexed 0..3:
#   0: lead -> MQL   1: MQL -> SQL   2: SQL -> opportunity   3: opportunity -> won
# `lift[s]` = probability that ONE touch of the channel advances an account at stage s.
# That is the channel's true causal effect; attribution models never see it.

seed: 42
n_accounts: 3000
cohort_span_days: 270      # leads are created across ~9 monthly cohorts
journey_days: 240          # touches/events happen up to 240 days after lead creation
data_end_day: 450          # data cutoff: late cohorts are right-censored
confounding: 0.6           # multiplies every channel's intent_loading (0 = no confounding)
gt_replicates: 48          # Monte-Carlo replicates for the counterfactual ground truth

channels:
  outbound_email:
    rate: 3.0              # expected touches per account (before intent/ABM scaling)
    timing: [1.4, 3.0]     # Beta(a, b) position of the touch inside the journey (early)
    intent_loading: 0.1
    abm_loading: 0.0
    lift: [0.030, 0.050, 0.010, 0.000]
  linkedin:
    rate: 2.0
    timing: [1.2, 2.0]
    intent_loading: 0.3
    abm_loading: 0.8       # shares an ABM-targeting factor with paid + events (correlation)
    lift: [0.020, 0.010, 0.000, 0.010]
  paid:
    rate: 3.5
    timing: [1.0, 2.5]
    intent_loading: 0.6    # retargeting follows high-intent accounts (confounded)
    abm_loading: 0.6
    lift: [0.010, 0.000, 0.000, 0.000]
  webinar:
    rate: 0.8
    timing: [2.0, 2.0]
    intent_loading: 0.3
    abm_loading: 0.2
    lift: [0.250, 0.180, 0.150, 0.100]
  organic:
    rate: 3.0
    timing: [2.0, 1.6]
    intent_loading: 1.2    # in-market buyers search more: heavily confounded, low lift
    abm_loading: 0.0
    lift: [0.000, 0.000, 0.000, 0.000]
  sdr_call:
    rate: 1.6
    timing: [3.5, 1.4]     # late in the journey -> last-touch magnet
    intent_loading: 1.2
    abm_loading: 0.0
    lift: [0.000, 0.120, 0.100, 0.020]
  events:
    rate: 0.6
    timing: [2.5, 1.5]
    intent_loading: 0.4
    abm_loading: 0.5
    lift: [0.080, 0.080, 0.300, 0.300]

baseline:
  rate: 6.0                # unobserved non-marketing "nudges" per journey
  lift: [0.060, 0.080, 0.120, 0.180]
  intent_effect: 0.9       # high-intent accounts progress on their own more often
  direct_visit_prob: 0.15  # share of baseline nudges that leave a 'direct' web visit

noise:
  missing_utm_rate: 0.15   # digital touches that lose their UTM/referrer -> 'direct'
  identify_rate: 0.75      # contacts whose anonymous web sessions get identified
  personal_email_rate: 0.10  # contacts on gmail etc. that CRM never linked to an account
  stage_lag_mean_days: 3.0 # CRM records stage changes late (exponential lag)
  max_pageviews: 4

committee:
  min_size: 2
  mean_extra: 2.0          # committee size = min_size + Poisson(mean_extra), capped
  max_size: 8
  champion_weight: 0.5     # share of touches that hit the champion contact

attribution:
  window_days: 365
  half_life_days: 14
  markov_order: 2
  shapley_exact_max_channels: 10
  shapley_mc_permutations: 2000
  session_timeout_minutes: 30
